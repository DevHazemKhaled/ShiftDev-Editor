<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiftDev Studio | الإعدادات</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 40px; max-width: 600px; margin: 0 auto; }
        .box { background: #1e293b; padding: 25px; border-radius: 10px; border: 1px solid #334155; }
        h2 { color: #d4af37; margin-top: 0; }
        label { display: block; margin: 15px 0 5px; color: #94a3b8; }
        input, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; }
        .btn-save { margin-top: 20px; background: #d4af37; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        a { color: #d4af37; text-decoration: none; display: inline-block; margin-bottom: 20px; }
    </style>
</head>
<body>
    <a href="/editor">← الرجوع للمحرر</a>
    <div class="box">
        <h2>إعدادات بيئة العمل ⚙️</h2>
        <label>مظهر المحرر (Theme):</label>
        <select>
            <option>Dark Gold (ShiftDev Default)</option>
            <option>VS Code Dark Modern</option>
            <option>Monokai Pro</option>
        </select>
        <label>حجم الخط (Font Size):</label>
        <input type="number" value="14">
        <button class="btn-save">حفظ التغييرات</button>
    </div>
</body>
</html>
