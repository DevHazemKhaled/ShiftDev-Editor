<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiftDev Cloud Studio | الرئيسية</title>
    <link rel="stylesheet" href="/css/global.css">
    <style>
        .hero-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .hero-title {
            font-size: 2.8rem;
            color: var(--accent-gold);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .hero-subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .action-btns {
            display: flex;
            gap: 20px;
        }
        .btn-gold {
            background-color: var(--accent-gold);
            color: #000;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        .btn-gold:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        .btn-secondary:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }
    </style>
</head>
<body>
    <div class="hero-container">
        <h1 class="hero-title">ShiftDev Cloud Studio Pro</h1>
        <p class="hero-subtitle">بيئة التطوير السحابية المتكاملة لمحرر الأكواد مع محرك Monaco وروابط الـ WebSockets والترمينال المباشر.</p>
        <div class="action-btns">
            <a href="/editor" class="btn-gold">فتح محرر الأكواد ←</a>
            <a href="/settings" class="btn-secondary">الإعدادات ⚙️</a>
        </div>
    </div>
</body>
</html>
