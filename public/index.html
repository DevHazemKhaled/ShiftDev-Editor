<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiftDev Studio | الرئيسية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 40px; text-align: center; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #d4af37; margin-bottom: 10px; }
        p { color: #94a3b8; line-height: 1.6; }
        .nav-btns { display: flex; gap: 15px; justify-content: center; margin-top: 25px; }
        .btn { background: #d4af37; color: #0f172a; padding: 12px 24px; text-decoration: none; font-weight: bold; border-radius: 8px; transition: 0.3s; }
        .btn-outline { background: transparent; border: 1px solid #d4af37; color: #d4af37; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <h1>ShiftDev Cloud Studio 🚀</h1>
        <p>بيئة التطوير السحابية المتكاملة والمستقلة بالكامل للمطورين.</p>
        <div class="nav-btns">
            <a href="/editor" class="btn">فتح المحرر (Workspace) ←</a>
            <a href="/settings" class="btn btn-outline">الإعدادات ⚙️</a>
        </div>
    </div>
</body>
</html>
