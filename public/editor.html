<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiftDev Cloud Workspace</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/editor.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
    <script src="https://unpkg.com/piesocket-js@4"></script>
</head>
<body>
    <div class="editor-layout">
        <header class="top-bar">
            <div style="font-weight: bold; color: var(--accent-gold);">ShiftDev Cloud Studio</div>
            <div>
                <a href="/" style="color: var(--text-muted); text-decoration: none; margin-left: 15px;">الرئيسية</a>
                <a href="/settings" style="color: var(--text-muted); text-decoration: none;">الإعدادات</a>
            </div>
        </header>
        <div class="main-body">
            <aside class="file-tree">
                <h4 style="color: var(--accent-gold); margin-top: 0;">📁 شجرة المشروع</h4>
                <div id="tree-root">جاري التحميل...</div>
            </aside>
            <main class="monaco-workspace">
                <div id="monaco-container" class="code-editor-container"></div>
                <div class="terminal-container" id="terminal-log">
                    [ShiftDev Cloud Terminal v1.0 Ready]
                </div>
            </main>
        </div>
    </div>
    <script src="/js/editor-core.js"></script>
    <script src="/js/terminal-client.js"></script>
</body>
</html>
